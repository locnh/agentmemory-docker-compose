services:
  dragonfly:
    container_name: agentmemory-dragonfly
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
    ulimits:
      memlock: -1
    command:
      - "--logtostderr"
      - "--dir=/data"
      - "--dbfilename=agentmemory"
      - "--snapshot_cron=*/15 * * * *"
    volumes:
      - ./data-dragonfly:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  agentmemory:
    container_name: agentmemory
    depends_on:
      dragonfly:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        III_VERSION: "0.22.1"
    environment:
      - VIEWER_ALLOWED_ORIGINS=amemory.enhack.net
      - VIEWER_ALLOWED_HOSTS=amemory.enhack.net
      - AGENTMEMORY_VIEWER_HOST=0.0.0.0
      - AGENTMEMORY_AUTO_COMPRESS=true
      - AGENTMEMORY_INJECT_CONTEXT=true
      - VIEWER_ALLOWED_ORIGINS=/data-export
      - AGENTMEMORY_STATE_BACKEND=redis
      - AGENTMEMORY_REDIS_URL=redis://dragonfly:6379
      #- AGENTMEMORY_LLM_NOTHINK=1
      - AGENTMEMORY_DROP_STALE_INDEX=true
      - AGENTMEMORY_SLOTS=true
      - CONSOLIDATION_ENABLED=true
      - GRAPH_EXTRACTION_ENABLED=true
      - MAX_OBS_PER_SESSION=${MAX_OBS_PER_SESSION}
      # .env mapping
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL}
      - OPENAI_EMBEDDING_DIMENSIONS=${OPENAI_EMBEDDING_DIMENSIONS}
    ports:
      - "3111:3111"
      - "3113:3113"
    volumes:
      - ./data:/data
      - ./data-export:/data-export
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  default:
    external: true
    name: service_main
